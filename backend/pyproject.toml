[project]
name = "orchestrator"
version = "0.1.0"
description = "Python control plane for agent runtime orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "eth-account>=0.13.7,<1.0.0",
  "fastapi>=0.116.1,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "pydantic>=2.11.7,<3.0.0",
  "pydantic-settings>=2.10.1,<3.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "cryptography>=45.0.0,<47.0.0",
  "SQLAlchemy>=2.0.41,<3.0.0",
  "alembic>=1.16.2,<2.0.0",
  "psycopg[binary]>=3.2.9,<4.0.0",
]

[project.scripts]
orchestrator = "orchestrator.app:main"
orchestrator-import-runtime-json = "orchestrator.migrate_runtime_json:main"
orchestrator-init-db = "orchestrator.init_db:main"
orchestrator-outbox-worker = "orchestrator.outbox_worker:main"
orchestrator-runtime-worker = "orchestrator.lifecycle_worker:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
